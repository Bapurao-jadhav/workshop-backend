services:
  - type: web
    name: workshop-management-backend
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: workshop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: workshop-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: workshop-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: workshop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: workshop-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: arQnare
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_FORM_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: workshop-db
    plan: free
    databaseName: workshop_db
