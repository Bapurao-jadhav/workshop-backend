spring.application.name=workshop-management-backend

# Optionally load a local .env file
spring.config.import=optional:file:.env[.properties]

# --- Server ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workshopdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security / JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Application ---
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Google Form webhook ---
app.google-form.webhook-secret=${GOOGLE_FORM_WEBHOOK_SECRET:}
app.google-form.allow-user-claim=${GOOGLE_FORM_ALLOW_USER_CLAIM:true}

# --- Transactional email via Brevo HTTPS API ---
# Set BREVO_API_KEY as an environment variable; do not define it here.
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:arQnare}
app.mail.from=${MAIL_FROM:}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method