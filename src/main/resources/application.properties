spring.application.name=workshop-management-backend
# Optionally load a local .env file (KEY=VALUE lines). Real environment variables always win.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/workshopdb
spring.datasource.username=postgres
spring.datasource.password=root1234

# --- JPA / schema management (Flyway owns the schema; set JPA_DDL_AUTO=validate to make Hibernate verify it) ---
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security / JWT (JWT_SECRET is mandatory, at least 32 characters) ---
app.jwt.secret=thisismylongestjwtsecretekey12345678900
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- CORS (comma separated; wildcard patterns such as https://*.vercel.app are allowed) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Application ---
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Mail (emails are only sent when MAIL_HOST is set; otherwise they are logged and skipped) ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@workshops.local}

# --- Actuator (health only) ---
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
